    <h1>Contact me</h1>
    
    <form action="mailto:mbunyay@ucsd.org" method="POST" enctype="text/plain">
        <label>
            <span>Email:</span>
            <input type="email" name="email" required>
        </label>

        <label>
            <span>Subject:</span>
            <input name="subject" required>
        </label>

        <label>
            <span>Message:</span>
            <textarea name="body" rows="5" required></textarea>
        </label>

        <button type="submit">Send</button>
    </form>
